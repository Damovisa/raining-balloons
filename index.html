<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎈 Raining Balloons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Setup Screen -->
        <div id="setup-screen" class="screen active">
            <h1>🎈 Raining Balloons 💧</h1>
            <p class="subtitle">Don't get soaked!</p>
            <div class="setup-form">
                <div class="form-group">
                    <label>Number of Players</label>
                    <div class="button-group">
                        <button class="opt-btn" data-option="players" data-value="2">2</button>
                        <button class="opt-btn selected" data-option="players" data-value="3">3</button>
                        <button class="opt-btn" data-option="players" data-value="4">4</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Number of Bunkers</label>
                    <div class="button-group">
                        <button class="opt-btn" data-option="bunkers" data-value="2">2</button>
                        <button class="opt-btn selected" data-option="bunkers" data-value="4">4</button>
                        <button class="opt-btn" data-option="bunkers" data-value="6">6</button>
                        <button class="opt-btn" data-option="bunkers" data-value="8">8</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Balloons per Round</label>
                    <div class="button-group">
                        <button class="opt-btn" data-option="balloons" data-value="3">3</button>
                        <button class="opt-btn selected" data-option="balloons" data-value="5">5</button>
                        <button class="opt-btn" data-option="balloons" data-value="8">8</button>
                        <button class="opt-btn" data-option="balloons" data-value="12">12</button>
                    </div>
                </div>
                <button id="start-game" class="big-btn">Start Game! 🎮</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <h2 id="game-title">🎈 Raining Balloons</h2>
                <div id="round-info">Round <span id="round-num">1</span></div>
            </div>
            <div class="game-layout">
                <div class="left-panel">
                    <div id="player-status"></div>
                </div>
                <div class="center-panel">
                    <div id="board"></div>
                    <div id="turn-info"></div>
                </div>
                <div class="right-panel">
                    <div id="card-area">
                        <h3 id="card-area-title">Card Deck</h3>
                        <div id="card-deck-wrapper">
                            <div id="card-deck" class="card-deck" title="Click deck to draw">
                                <div class="deck-layer"></div>
                                <div class="deck-layer"></div>
                                <div class="deck-layer"></div>
                                <div class="deck-top">🎴</div>
                            </div>
                            <div class="deck-count-label"><span id="deck-count">36</span> cards left</div>
                        </div>
                        <div id="drawn-card" class="card-display empty">
                            <p>Click the deck to draw</p>
                        </div>
                        <button id="use-card-btn" class="action-btn hidden">✅ Use Card</button>
                        <button id="discard-btn" class="action-btn hidden">❌ Discard</button>
                        <button id="done-moving-btn" class="action-btn hidden">✅ Done Moving</button>
                        <div id="end-turn-timer-wrap" class="hidden">
                            <div id="end-turn-timer-bar"></div>
                            <button id="end-turn-btn" class="action-btn">➡️ End Turn Now</button>
                        </div>
                    </div>
                    <div id="round-controls" class="hidden">
                        <button id="drop-balloons-btn" class="big-btn danger">💧 Drop Balloons!</button>
                    </div>
                    <div id="redo-controls" class="hidden">
                        <div id="redo-deciding-info" class="redo-info"></div>
                        <button id="redo-btn" class="action-btn">🔄 Use Redo!</button>
                        <button id="accept-drop-btn" class="action-btn">➡️ Next Round</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen">
            <h1>🎉 Game Over!</h1>
            <p id="winner-text"></p>
            <button id="play-again-btn" class="big-btn">Play Again 🔄</button>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="game.js"></script>
</body>
</html>
